{% extends 'base.html' %}

{% block content %}
    <h1>Últimas Notícias</h1>
    
    {% for noticia in noticias %}
        <div class="card">
            <h3>
                <a href="{% url 'noticias:detalhe' noticia.id %}">{{ noticia.titulo }}</a>
            </h3>
            <p>
                Categoria: 
                <a href="{% url 'categoria:detalhe' noticia.categoria.id %}" class="badge">
                    {{ noticia.categoria.nome }}
                </a>
            </p>
        </div>
    {% empty %}
        <p>Nenhuma notícia cadastrada no momento.</p>
    {% endfor %}
{% endblock %}
